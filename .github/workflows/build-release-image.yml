name: Build and Publish Release Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version tag to publish (defaults to the pushed git tag)'
        required: false
        default: ''
      LINA_BRANCH:
        description: 'js-lina branch/tag to build from (default: dev for normal tags, main for -stable tags)'
        required: false
        default: ''
      LUNA_BRANCH:
        description: 'js-luna branch/tag to build from (default: dev for normal tags, main for -stable tags)'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build vars
        id: vars
        run: |
          VERSION="${{ github.event.inputs.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # -stable tags come from the dev->main production promotion, so
          # assemble lina/luna from their main; any other tag is a dev
          # pre-release, so assemble from their dev.
          LINA_BRANCH="${{ github.event.inputs.LINA_BRANCH }}"
          LUNA_BRANCH="${{ github.event.inputs.LUNA_BRANCH }}"
          if [[ -z "${LINA_BRANCH}" || -z "${LUNA_BRANCH}" ]]; then
            case "${VERSION}" in
              *-stable) DEFAULT_BRANCH="main" ;;
              *)        DEFAULT_BRANCH="dev" ;;
            esac
            [ -z "${LINA_BRANCH}" ] && LINA_BRANCH="${DEFAULT_BRANCH}"
            [ -z "${LUNA_BRANCH}" ] && LUNA_BRANCH="${DEFAULT_BRANCH}"
          fi
          echo "lina_branch=${LINA_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "luna_branch=${LUNA_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image via bake
        # docker-bake.hcl fetches js-lina/js-luna as remote git build contexts,
        # and both are private repos. The buildx driver here is
        # "docker-container", so BuildKit fetches those git contexts *inside
        # its own builder container* - it never sees the runner's
        # ~/.gitconfig, so a `git config --global insteadOf` on the runner
        # (tried before) has no effect there. BuildKit's git source does
        # support auth for this exact case via the reserved GIT_AUTH_TOKEN
        # secret, which crosses the container boundary correctly.
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          LINA_BRANCH: ${{ steps.vars.outputs.lina_branch }}
          LUNA_BRANCH: ${{ steps.vars.outputs.luna_branch }}
          PUSH_ENABLED: "true"
          GIT_AUTH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: docker buildx bake ce
