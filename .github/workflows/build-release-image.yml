name: Build and Publish Release Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version tag to publish (defaults to the pushed git tag)'
        required: false
        default: ''
      LINA_BRANCH:
        description: 'js-lina branch/tag to build from'
        required: false
        default: 'dev'
      LUNA_BRANCH:
        description: 'js-luna branch/tag to build from'
        required: false
        default: 'dev'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build vars
        id: vars
        run: |
          VERSION="${{ github.event.inputs.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image via bake
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          LINA_BRANCH: ${{ github.event.inputs.LINA_BRANCH || 'dev' }}
          LUNA_BRANCH: ${{ github.event.inputs.LUNA_BRANCH || 'dev' }}
          PUSH_ENABLED: "true"
        run: docker buildx bake ce
